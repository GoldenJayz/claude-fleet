[package]
name = "claude-fleet"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pane: Claude usage and PC performance across your machines"

[lib]
name = "claude_fleet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tracing = "0.1"

# Phone only: checking for and downloading updates (Windows uses the Tauri updater).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
sha2 = "0.10"
ureq = { version = "3", features = ["json"] }

# Desktop only: the collector, tray, autostart and window effects. The phone app is just the dashboard.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
anyhow = "1"
fleet-collector = { path = "../crates/collector" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["net", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
window-vibrancy = "0.8"
